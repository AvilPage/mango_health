services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - pb_data:/pb/pb_data
    ports:
      - "8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      caddy: mango-health-api.avilpage.com
      caddy.reverse_proxy: "{{upstreams 8090}}"

volumes:
  pb_data:
